services:
  rustplusbot:
    image: ghcr.io/haxxorhardy/rustplusplus:master
    container_name: rustplusbot
    # A tiny init as PID 1 forwards SIGTERM to node and reaps the ffmpeg/graphicsmagick child processes.
    init: true
    environment:
      - RPP_DISCORD_TOKEN=TOKEN
      - RPP_DISCORD_CLIENT_ID=CLIENT_ID
    volumes:
      - ./logs:/app/logs
      - ./instances:/app/instances
      - ./credentials:/app/credentials
      - ./maps:/app/maps
      - ./runtime:/app/runtime
    restart: unless-stopped
