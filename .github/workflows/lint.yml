on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint - Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [ 22 ]
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: ${{ matrix.node }}
        cache: 'npm'
    - run: npm ci

    # The three steps below are `npm test`, split so each one has its own log for the failure report.
    # tsconfig.json has checkJs off: this only parses every JavaScript file (syntax errors), it is no type check.
    - name: Syntax check (JavaScript)
      run: |
        set -o pipefail
        npx tsc --noEmit -p . 2>&1 | tee tsc.log

    - name: Type check (JavaScript, tsconfig.checkjs.json)
      run: |
        set -o pipefail
        npx tsc -p tsconfig.checkjs.json 2>&1 | tee tsc-checkjs.log

    - name: Tests
      run: |
        set -o pipefail
        node --test "test/**/*.test.js" 2>&1 | tee test.log

    # The step logs are only visible to signed in users, the annotations are readable through the API.
    - name: Report the failure
      if: failure()
      run: |
        for log in tsc.log tsc-checkjs.log test.log; do
          if [ -f "$log" ]; then
            grep -E "error TS|not ok|AssertionError|Error:|# fail|Cannot find" "$log" | tail -n 8 | sed 's/^/::error::/'
          fi
        done
