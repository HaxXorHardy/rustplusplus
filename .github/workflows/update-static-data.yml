name: Update static game data

on:
  workflow_dispatch:
    inputs:
      items:
        description: "Refresh the item metadata from the Rust dedicated server"
        required: false
        default: true
        type: boolean
      rustlabs:
        description: "Refresh the RustLabs wiki data (has to get past Cloudflare)"
        required: false
        default: false
        type: boolean
      sleep_ms:
        description: "Delay between RustLabs page requests in milliseconds"
        required: false
        default: "1500"
        type: string
      headless:
        description: "Run the scraper browser without a window"
        required: false
        default: true
        type: boolean
      dry_run:
        description: "Only report changes, do not commit"
        required: false
        default: false
        type: boolean
  schedule:
    # Monthly, on the 1st at 04:00 UTC.
    - cron: "0 4 1 * *"

permissions:
  contents: write

concurrency:
  group: update-static-data
  cancel-in-progress: false

jobs:
  update-static-data:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The pipeline only uses Node built-ins; only the RustLabs scraper needs playwright-core.
      - name: Install scraper dependency
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright-core

      # scripts/downloadRustItems.js pulls only Bundles/items/*.json from depot 258554 (~0.5 MB)
      # out of the ~5 GB Rust dedicated server depot. That depot is downloadable anonymously,
      # so this needs no Steam credentials. The version is pinned for reproducible runs.
      - name: Install DepotDownloader
        if: github.event_name == 'schedule' || inputs.items
        env:
          DEPOT_DOWNLOADER_VERSION: DepotDownloader_3.4.0
        run: |
          set -euo pipefail
          mkdir -p .cache/depotdownloader
          curl -fsSL \
            "https://github.com/SteamRE/DepotDownloader/releases/download/${DEPOT_DOWNLOADER_VERSION}/DepotDownloader-linux-x64.zip" \
            -o "${RUNNER_TEMP}/depotdownloader.zip"
          unzip -q -o "${RUNNER_TEMP}/depotdownloader.zip" -d .cache/depotdownloader
          chmod +x .cache/depotdownloader/DepotDownloader
          echo "RPP_DEPOTDOWNLOADER_PATH=${GITHUB_WORKSPACE}/.cache/depotdownloader/DepotDownloader" >> "${GITHUB_ENV}"

      - name: Locate browser
        id: browser
        run: |
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then
              echo "path=$(command -v "$candidate")" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "No supported browser found (only required for the RustLabs refresh)."

      - name: Update static data
        env:
          INPUT_ITEMS: ${{ github.event_name == 'schedule' && 'true' || inputs.items }}
          INPUT_RUSTLABS: ${{ github.event_name == 'schedule' && 'true' || inputs.rustlabs }}
          INPUT_HEADLESS: ${{ github.event_name == 'schedule' && 'true' || inputs.headless }}
          INPUT_SLEEP_MS: ${{ inputs.sleep_ms || '1500' }}
          RPP_RUSTLABS_BROWSER_PATH: ${{ steps.browser.outputs.path }}
          RPP_RUSTLABS_BROWSER_ARGS: "--no-sandbox --disable-dev-shm-usage"
        run: |
          set -euo pipefail

          args=()

          if [ "${INPUT_ITEMS:-true}" = "true" ]; then
            # Download the item meta files from the Rust dedicated server and regenerate items.json.
            args+=(--download)
          else
            args+=(--skip-items)
          fi

          if [ "${INPUT_RUSTLABS:-}" != "true" ]; then
            args+=(--skip-rustlabs)
          fi

          if [ "${INPUT_HEADLESS:-}" = "true" ]; then
            args+=(--headless)
          else
            args+=(--visible)
          fi

          node scripts/updateStaticData.js "${args[@]}" --sleep "${INPUT_SLEEP_MS:-1500}"

      - name: Commit changes
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/static-json data/staticData.sqlite

          if git diff --cached --quiet; then
            echo "No static data changes to commit."
            exit 0
          fi

          git commit -m "chore(static-data): automated refresh"
          git push origin "HEAD:${{ github.ref_name }}"
