name: Feature request
description: An idea for the bot
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      placeholder: A command that shows ..., the embed should also show ...
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why?
      description: What problem does it solve for you?
    validations:
      required: false
